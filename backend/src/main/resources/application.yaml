spring:
  application:
    name: interview-ai-backend

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  ai:
    model:
      chat: none
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_GRPC_PORT:6334}
        api-key: ${QDRANT_API_KEY:}
        collection-name: ${QDRANT_COLLECTION:interview_ai_documents}
        content-field-name: content
        use-tls: ${QDRANT_USE_TLS:false}
        initialize-schema: ${QDRANT_INITIALIZE_SCHEMA:false}
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        metadata-mode: NONE

  flyway:
    enabled: true

server:
  port: 8080

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 14d

  refresh-token:
    cleanup:
      enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:false}
      fixed-delay: ${REFRESH_TOKEN_CLEANUP_FIXED_DELAY:1h}
      initial-delay: ${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY:1m}
      batch-size: ${REFRESH_TOKEN_CLEANUP_BATCH_SIZE:1000}

  refresh-cookie:
    name: refresh_token
    path: /api/auth
    same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
    secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}

  frontend:
    oauth2-success-url: ${OAUTH2_SUCCESS_URL:http://localhost:5173/oauth/callback}

management:
  endpoints:
    web:
      exposure:
        include: health, info

resume:
  file:
    max-size: 10MB
    storage-root: ${RESUME_STORAGE_ROOT:./data/resumes}

rag:
  worker:
    lease-seconds: ${RAG_WORKER_LEASE_SECONDS:300}
    retry-delay-seconds: ${RAG_WORKER_RETRY_DELAY_SECONDS:30}

  indexing:
    enabled: ${RAG_INDEXING_ENABLED:false}
    fixed-delay: ${RAG_INDEXING_FIXED_DELAY:1s}
    initial-delay: ${RAG_INDEXING_INITIAL_DELAY:5s}
    max-jobs-per-run: ${RAG_INDEXING_MAX_JOBS_PER_RUN:20}
    chunk-size: 700
    chunk-overlap: 100
    max-chunks: 10000
    write-batch-size: ${RAG_INDEXING_WRITE_BATCH_SIZE:20}

  search:
    enabled: ${RAG_SEARCH_ENABLED:false}

interview:
  generation:
    enabled: ${INTERVIEW_GENERATION_ENABLED:false}
    mode: ${INTERVIEW_GENERATION_MODE:FALLBACK_ONLY}
    model: ${INTERVIEW_CHAT_MODEL:}
    fixed-delay: ${INTERVIEW_GENERATION_FIXED_DELAY:1s}
    initial-delay: ${INTERVIEW_GENERATION_INITIAL_DELAY:5s}

  evaluation:
    enabled: ${INTERVIEW_EVALUATION_ENABLED:false}
    mode: ${INTERVIEW_EVALUATION_MODE:FALLBACK_ONLY}
    model: ${INTERVIEW_EVALUATION_MODEL:${INTERVIEW_CHAT_MODEL:}}
    fixed-delay: ${INTERVIEW_EVALUATION_FIXED_DELAY:1s}
    initial-delay: ${INTERVIEW_EVALUATION_INITIAL_DELAY:5s}
    max-jobs-per-run: ${INTERVIEW_EVALUATION_MAX_JOBS_PER_RUN:20}

cover-letter:
  draft:
    enabled: ${COVER_LETTER_DRAFT_ENABLED:false}
    model: ${COVER_LETTER_DRAFT_MODEL:${INTERVIEW_CHAT_MODEL:}}
    fixed-delay: ${COVER_LETTER_DRAFT_FIXED_DELAY:1s}
    initial-delay: ${COVER_LETTER_DRAFT_INITIAL_DELAY:5s}
    max-jobs-per-run: ${COVER_LETTER_DRAFT_MAX_JOBS_PER_RUN:20}

ai:
  usage:
    enabled: ${AI_USAGE_ENABLED:true}
    chat-admission-enabled: ${AI_CHAT_ADMISSION_ENABLED:true}
    embedding-admission-enabled: ${AI_EMBEDDING_ADMISSION_ENABLED:true}
    hmac-key: ${AI_USAGE_HMAC_KEY:}
    initial-questions-daily-limit: ${AI_INITIAL_QUESTIONS_DAILY_LIMIT:3}
    follow-up-daily-limit: ${AI_FOLLOW_UP_DAILY_LIMIT:15}
    answer-evaluation-daily-limit: ${AI_ANSWER_EVALUATION_DAILY_LIMIT:30}
    cover-letter-draft-daily-limit: ${AI_COVER_LETTER_DRAFT_DAILY_LIMIT:3}
    personal-embedding-daily-limit: ${AI_PERSONAL_EMBEDDING_DAILY_LIMIT:20}
    user-active-limit: ${AI_USER_ACTIVE_LIMIT:2}
    global-active-limit: ${AI_GLOBAL_ACTIVE_LIMIT:50}
    global-chat-daily-limit: ${AI_GLOBAL_CHAT_DAILY_LIMIT:500}
    admin-embedding-per-minute-limit: ${AI_ADMIN_EMBEDDING_PER_MINUTE_LIMIT:10}
    follow-up-lease-seconds: ${AI_FOLLOW_UP_LEASE_SECONDS:90}