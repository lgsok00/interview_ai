spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  forward-headers-strategy: native
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${DEPLOYMENT_ENVIRONMENT:production}

  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO

resume:
  file:
    storage-root: ${RESUME_STORAGE_ROOT}
