spring:
  application:
    name: interview-ai-backend

  profiles:
    default: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email

          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  flyway:
    enabled: true

server:
  port: 8080

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 14d

  refresh-token:
    cleanup:
      enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:false}
      fixed-delay: ${REFRESH_TOKEN_CLEANUP_FIXED_DELAY:1h}
      initial-delay: ${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY:1m}
      batch-size: ${REFRESH_TOKEN_CLEANUP_BATCH_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health, info

resume:
  file:
    max-size: 10MB
    storage-root: ${RESUME_STORAGE_ROOT:./data/resumes}
