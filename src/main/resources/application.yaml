spring:
  application:
    name: interview-ai-backend

  profiles:
    default: local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080

auth:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 1h
    refresh-token-expiration: 14d

  refresh-token:
    cleanup:
      enabled: ${REFRESH_TOKEN_CLEANUP_ENABLED:true}
      fixed-delay: ${REFRESH_TOKEN_CLEANUP_FIXED_DELAY:1h}
      initial-delay: ${REFRESH_TOKEN_CLEANUP_INITIAL_DELAY:1m}
      batch-size: ${REFRESH_TOKEN_CLEANUP_BATCH_SIZE:1000}

management:
  endpoints:
    web:
      exposure:
        include: health, info
