spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - openid
              - profile
              - email

          github:
            client-id: test-github-client-id
            client-secret: test-github-client-secret
            scope:
              - read:user
              - user:email

  flyway:
    enabled: true
